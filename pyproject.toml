[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-agent-rl"
version = "0.1.0"
description = "个人电商客服 Agent 的 SFT、多轮 GRPO 与业务结果评估项目"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

# 审计、本机推理、训练分别使用独立环境；完整版本锁见 requirements/。
# tau2-bench 从固定 commit 的源码安装，不在此自动拉取最新版本。
[project.optional-dependencies]
audit = ["transformers==4.57.6", "jinja2==3.1.6", "pydantic==2.12.3", "loguru==0.7.3", "docstring-parser==0.17.0", "PyYAML==6.0.3", "deepdiff==8.6.1", "addict==2.4.0", "python-dotenv==1.2.1", "toml==0.10.2"]
environment = ["pandas==2.2.3"]
train = ["torch==2.8.0", "transformers==4.57.6", "trl==0.26.2", "peft==0.18.0", "accelerate==1.12.0", "datasets==4.4.1"]
customer = ["requests==2.34.2"]
local-inference = ["mlx-lm==0.29.1; platform_system == 'Darwin'", "mlx==0.29.2; platform_system == 'Darwin'", "transformers==4.57.6"]
demo = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]
