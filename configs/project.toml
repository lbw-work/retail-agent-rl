status = "rl_v3_reviewed_sft_v2_cuda_pending"
name = "RetailAgent-RL"
model_id = "Qwen/Qwen3-4B"
model_revision = "1cfa9a7208912126459214e8b04321603b3df60c"
enable_thinking = false
training_language = "en"
ui_language = "zh"
seed = 42

[data]
dataset_id = "inclusionAI/AReaL-tau2-data"
dataset_revision = "86971dc03da6e7c1a7933295e05b84aab8215386"
domain = "retail"
dataset_version = "retail_full_v2"
rl_dataset_version = "retail_rl_v3"
