# v1 的 82 个任务已验证；v2 另有全量逐条参考检查，均不代表模型能力。
rl_businesses = ["cancel_pending_order", "exchange_delivered_order_items", "return_delivered_order_items", "modify_pending_order_address", "modify_pending_order_items", "modify_pending_order_payment", "modify_user_address"]

[customer]
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
enable_thinking = false
temperature = 0.0
timeout_seconds = 60
max_retries = 2

[budget]
currency = "CNY"
total_limit = 50.0
gpu_limit = 35.0
api_limit = 10.0
reserve_limit = 5.0
# 启动新批次前须预留在途请求、保存与最终评估费用。
stop_starting_new_work_at = 45.0
