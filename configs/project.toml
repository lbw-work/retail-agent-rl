[environment]
repository = "https://github.com/sierra-research/tau2-bench"
commit = "f8de30c298689cbe0117d76a378e7315a17e5bd8"
tag = "v0.2.0"
validation_status = "v2_563_raw_tasks_replayed_v3_514_rl_tasks_reaudited"
